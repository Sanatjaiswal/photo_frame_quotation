<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Frame &amp; Co — Interactive Prototype</title>
  <meta name="description" content="Clickable prototype: upload a photo, see it framed, price it by country, and run the shop admin.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Frame &amp; Co — Interactive Prototype">
  <meta property="og:description" content="Clickable prototype: upload a photo, see it framed, price it by country, and run the shop admin.">
  <meta name="twitter:card" content="summary">
</head>
<body>
<style>
/* ============================================================
   Single visual world: a warm gallery. Deliberately light-only —
   a storefront brand mockup should show the client one look.
   Every colour is painted explicitly so the page holds on any host ground.
   ============================================================ */
:root{
  --brand:#1F3D33;        /* deep spruce - gallery wall trim */
  --brand-2:#2E594A;
  --brand-ink:#14291F;
  --brand-wash:#E8EEEA;
  --brass:#A8813C;        /* hardware, hanging wire */
  --brass-wash:#F5EEDF;

  --paper:#F3F2EE;        /* warm grey gallery wall, not cream */
  --surface:#FFFFFF;
  --surface-2:#FAF9F6;
  --ink:#181A17;
  --ink-soft:#575B54;
  --ink-faint:#8A8E86;
  --rule:#E2E0D9;
  --rule-soft:#EDEBE5;

  --ok:#2E6B4B; --ok-wash:#E5EFE9;
  --warn:#8A6218; --warn-wash:#F7EEDA;
  --bad:#9B3A2C;  --bad-wash:#F6E6E2;
  --info:#2C5570; --info-wash:#E5EDF2;

  --serif:"Bodoni MT",Didot,"Hoefler Text",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;

  --sh-1:0 1px 2px rgba(24,26,23,.06);
  --sh-2:0 2px 6px rgba(24,26,23,.07), 0 12px 28px -18px rgba(24,26,23,.4);
  --sh-3:0 8px 20px rgba(24,26,23,.1), 0 28px 60px -30px rgba(24,26,23,.5);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-family:var(--serif);font-weight:600;letter-spacing:-.012em;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(2rem,4.6vw,3.3rem);letter-spacing:-.024em}
h2{font-size:clamp(1.45rem,2.6vw,2.05rem)}
h3{font-size:1.2rem}
h4{font-size:1rem;line-height:1.3}
p{margin:0}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:3px}
img{max-width:100%;display:block}

.eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
.muted{color:var(--ink-soft)}
.faint{color:var(--ink-faint)}
.sm{font-size:.875rem}
.xs{font-size:.79rem}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}.gap16{gap:16px}
.gap20{gap:20px}.gap24{gap:24px}.gap32{gap:32px}.gap40{gap:40px}
.wrapf{flex-wrap:wrap}.between{justify-content:space-between}.center{justify-content:center}
.grow{flex:1}.mt-auto{margin-top:auto}

/* ---------------- prototype bar ---------------- */
.proto{
  background:var(--brand-ink);color:#DCE6E0;font-size:.78rem;
  padding:7px 22px;display:flex;gap:14px;align-items:center;justify-content:center;
  flex-wrap:wrap;text-align:center;letter-spacing:.01em;
}
.proto b{color:#fff;font-weight:650}
.proto .dot{width:5px;height:5px;border-radius:50%;background:var(--brass);flex:none}

/* ---------------- site header ---------------- */
.site{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.site-in{max-width:1180px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;gap:22px}
.logo{display:flex;align-items:center;gap:9px;cursor:pointer;background:none;border:0;padding:0}
.logo-mk{width:26px;height:30px;border:2.5px solid var(--brand);border-radius:2px;padding:3px;flex:none}
.logo-mk i{display:block;width:100%;height:100%;background:var(--brass);opacity:.8}
.logo-tx{font-family:var(--serif);font-size:1.16rem;font-weight:600;letter-spacing:.01em;line-height:1}
.logo-tx small{display:block;font-family:var(--sans);font-size:.56rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-faint);font-weight:650;margin-top:3px}
nav.main{display:flex;gap:4px;margin-left:6px}
nav.main button{background:none;border:0;padding:7px 11px;border-radius:4px;font-size:.88rem;color:var(--ink-soft);cursor:pointer}
nav.main button:hover{background:var(--surface-2);color:var(--ink)}
nav.main button[aria-current="true"]{color:var(--brand);font-weight:650;background:var(--brand-wash)}

.ctrl{display:flex;align-items:center;gap:7px;border:1px solid var(--rule);border-radius:5px;padding:5px 9px;background:var(--surface);cursor:pointer}
.ctrl:hover{border-color:var(--brand)}
.ctrl select{border:0;background:none;font-size:.85rem;cursor:pointer;padding:0;max-width:150px}
.ctrl .cc{font-family:var(--mono);font-size:.7rem;font-weight:700;color:var(--brand);background:var(--brand-wash);padding:2px 5px;border-radius:3px;letter-spacing:.04em}

/* ---------------- buttons ---------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:5px;border:1px solid transparent;
  font-size:.9rem;font-weight:600;cursor:pointer;text-decoration:none;
  transition:background .14s,border-color .14s,transform .1s;
}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--brand);color:#fff}
.btn-p:hover{background:var(--brand-2)}
.btn-p:disabled{background:var(--rule);color:var(--ink-faint);cursor:not-allowed}
.btn-s{background:var(--surface);border-color:var(--rule);color:var(--ink)}
.btn-s:hover{border-color:var(--brand);color:var(--brand)}
.btn-g{background:none;border-color:transparent;color:var(--brand);padding:9px 10px}
.btn-g:hover{background:var(--brand-wash)}
.btn-sm{padding:7px 13px;font-size:.82rem}
.btn-lg{padding:14px 26px;font-size:.96rem}
.btn-full{width:100%}

/* ---------------- THE FRAME RENDERER ---------------- */
.frame{
  position:relative;padding:var(--mw);background:var(--mb);border-radius:2px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.20),
    inset 0 -1px 0 1px rgba(0,0,0,.16),
    0 1px 3px rgba(24,26,23,.16),
    0 20px 44px -20px rgba(24,26,23,.55);
}
.frame.grain::before{
  content:"";position:absolute;inset:0;border-radius:2px;pointer-events:none;
  background:repeating-linear-gradient(94deg,
    rgba(255,255,255,.07) 0 1px, rgba(0,0,0,.055) 1px 3px,
    rgba(255,255,255,.025) 3px 6px, rgba(0,0,0,.03) 6px 10px);
  mix-blend-mode:overlay;
}
.frame.metal::before{
  content:"";position:absolute;inset:0;border-radius:2px;pointer-events:none;
  background:repeating-linear-gradient(100deg,
    rgba(255,255,255,.16) 0 1px, rgba(255,255,255,0) 1px 4px);
  mix-blend-mode:screen;
}
.mat{position:relative;padding:var(--matw);background:var(--matbg);box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}
.mat::after{
  content:"";position:absolute;inset:var(--matw);pointer-events:none;z-index:3;
  box-shadow:0 0 0 1px rgba(0,0,0,.16), inset 0 1px 4px rgba(0,0,0,.34);
}
.win{position:relative;overflow:hidden;aspect-ratio:var(--ar);background:#E9E7E2}
.win img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:center center;will-change:transform}
.win::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(118deg,rgba(255,255,255,.17) 0 20%,rgba(255,255,255,.04) 33%,rgba(255,255,255,0) 50%);
}
.win.empty{display:flex;align-items:center;justify-content:center;background:
  repeating-linear-gradient(45deg,#EDEBE6 0 9px,#E5E2DB 9px 18px)}
.win.empty span{font-size:.8rem;color:var(--ink-faint);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.win.grab{cursor:grab}.win.grabbing{cursor:grabbing}

/* ---------------- home ---------------- */
.hero{padding:64px 0 52px;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.hero h1{margin:16px 0 18px;max-width:13ch}
.hero .lede{font-size:1.08rem;color:var(--ink-soft);max-width:46ch;margin-bottom:26px}
.hero-cta{display:flex;gap:11px;flex-wrap:wrap;margin-bottom:26px}
.trust{display:flex;gap:22px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-faint);border-top:1px solid var(--rule);padding-top:18px}
.trust b{display:block;font-family:var(--serif);font-size:1.32rem;color:var(--ink);font-weight:600;line-height:1.1}
.hero-art{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:20px;padding-bottom:14px}
.hero-art .hang{position:relative}
.hero-art .hang::before{
  content:"";position:absolute;left:50%;bottom:100%;width:1px;height:34px;
  background:linear-gradient(180deg,rgba(24,26,23,0),var(--brass));
}
.hero-art .a{width:56%;z-index:2}
.hero-art .b{width:40%;margin-bottom:34px}

.strip{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--surface)}
.strip-in{max-width:1180px;margin:0 auto;padding:18px 22px;display:grid;gap:1px;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));background:var(--rule)}
.strip-in>div{background:var(--surface);padding:2px 18px;display:flex;flex-direction:column;gap:2px}
.strip-in strong{font-size:.9rem}
.strip-in span{font-size:.78rem;color:var(--ink-faint)}

/* ---------------- catalogue ---------------- */
.sec{padding:56px 0}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:30px;flex-wrap:wrap}
.sec-h .t{max-width:52ch;display:flex;flex-direction:column;gap:9px}
.sec-h p{color:var(--ink-soft);font-size:.95rem}

.grid{display:grid;gap:26px;grid-template-columns:repeat(auto-fill,minmax(238px,1fr))}
.card{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:14px;font:inherit}
.card .art{padding:22px 22px 26px;background:var(--surface);border:1px solid var(--rule);border-radius:4px;transition:border-color .16s,transform .18s,box-shadow .18s}
.card:hover .art{border-color:var(--brand);transform:translateY(-3px);box-shadow:var(--sh-2)}
.card .meta{display:flex;flex-direction:column;gap:3px}
.card .nm{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.card .nm h4{font-size:1.03rem}
.card .pr{font-weight:650;font-size:.94rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.card .tg{font-size:.82rem;color:var(--ink-faint)}
.card .fr{font-size:.74rem;color:var(--brass);font-weight:600;letter-spacing:.03em}

/* ---------------- product ---------------- */
.crumbs{display:flex;gap:8px;align-items:center;font-size:.82rem;color:var(--ink-faint);padding:20px 0 0}
.crumbs button{background:none;border:0;padding:0;color:var(--ink-soft);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.crumbs button:hover{color:var(--brand)}

.pd{display:grid;grid-template-columns:1fr 1fr;gap:52px;padding:26px 0 60px;align-items:start}
.pd-art{background:var(--surface-2);border:1px solid var(--rule);border-radius:5px;padding:46px;display:flex;justify-content:center}
.pd-art .fw{width:min(340px,100%)}
.pd-info{display:flex;flex-direction:column;gap:24px}
.pd-title h1{font-size:2.1rem;margin-bottom:7px}
.pd-title p{color:var(--ink-soft);font-size:.95rem}
.pd-price{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.pd-price .big{font-family:var(--serif);font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pd-price .ctx{font-size:.82rem;color:var(--ink-faint)}

.opt{display:flex;flex-direction:column;gap:10px}
.opt-lbl{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.opt-lbl .k{font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.opt-lbl .v{font-size:.84rem;color:var(--ink-soft)}
.chips{display:flex;gap:9px;flex-wrap:wrap}
.chip{
  background:var(--surface);border:1px solid var(--rule);border-radius:5px;
  padding:9px 14px;cursor:pointer;font-size:.86rem;display:flex;flex-direction:column;gap:2px;
  min-width:96px;transition:border-color .14s,background .14s;
}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-wash);box-shadow:inset 0 0 0 1px var(--brand)}
.chip .c1{font-weight:600}
.chip .c2{font-size:.73rem;color:var(--ink-faint)}
.chip[aria-pressed="true"] .c2{color:var(--brand-2)}

.ship-box{border:1px solid var(--rule);border-radius:5px;background:var(--surface);overflow:hidden}
.ship-box .r{display:flex;justify-content:space-between;gap:14px;padding:11px 15px;font-size:.87rem;border-bottom:1px solid var(--rule-soft)}
.ship-box .r:last-child{border-bottom:0}
.ship-box .r b{font-variant-numeric:tabular-nums;font-weight:650}

/* ---------------- upload / studio ---------------- */
.studio{display:grid;grid-template-columns:1fr 400px;gap:44px;padding:26px 0 60px;align-items:start}
.stage{background:var(--surface-2);border:1px solid var(--rule);border-radius:5px;padding:40px;display:flex;flex-direction:column;align-items:center;gap:22px}
.stage .fw{width:min(360px,100%)}
.stage .hint{font-size:.79rem;color:var(--ink-faint);text-align:center}

.drop{
  border:1.5px dashed var(--rule);border-radius:6px;background:var(--surface);
  padding:34px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:11px;
  cursor:pointer;transition:border-color .15s,background .15s;
}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-wash)}
.drop .ico{width:38px;height:38px;border:2px solid var(--brand);border-radius:3px;position:relative;opacity:.75}
.drop .ico::after{content:"";position:absolute;left:5px;right:5px;bottom:5px;height:12px;background:var(--brand);opacity:.35;clip-path:polygon(0 100%,30% 30%,52% 66%,72% 44%,100% 100%)}
.drop b{font-size:.94rem}
.drop span{font-size:.82rem;color:var(--ink-faint)}

.samples{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.samples button{padding:0;border:1px solid var(--rule);border-radius:4px;overflow:hidden;cursor:pointer;background:var(--surface);position:relative;aspect-ratio:1}
.samples button:hover{border-color:var(--brand)}
.samples button[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-wash),0 0 0 3px var(--brand)}
.samples img{width:100%;height:100%;object-fit:cover}
.samples .lo{position:absolute;top:4px;right:4px;background:var(--bad);color:#fff;font-size:.56rem;font-weight:800;padding:1px 4px;border-radius:2px;letter-spacing:.05em}

.slider{width:100%;accent-color:var(--brand)}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:20px;display:flex;flex-direction:column;gap:15px}
.panel h4{font-size:.93rem}
.panel .k{font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}

.qual{display:flex;gap:11px;align-items:flex-start;border-radius:5px;padding:13px 15px;font-size:.85rem;line-height:1.5}
.qual .b{font-weight:700;display:block;margin-bottom:2px}
.qual .pip{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px}
.qual.q-ok{background:var(--ok-wash);color:var(--ok)}   .qual.q-ok .pip{background:var(--ok)}
.qual.q-wn{background:var(--warn-wash);color:var(--warn)} .qual.q-wn .pip{background:var(--warn)}
.qual.q-bd{background:var(--bad-wash);color:var(--bad)}  .qual.q-bd .pip{background:var(--bad)}
.qual .dpi{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700}

/* ---------------- forms ---------------- */
.form{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.f{display:flex;flex-direction:column;gap:5px}
.f.full{grid-column:1/-1}
.f label{font-size:.73rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.f input,.f select,.f textarea{
  border:1px solid var(--rule);border-radius:5px;padding:10px 12px;background:var(--surface);
  font-size:.9rem;width:100%;
}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-wash)}
.f textarea{resize:vertical;min-height:70px}
.f .err{font-size:.76rem;color:var(--bad)}
.f input.bad,.f select.bad{border-color:var(--bad)}

.co{display:grid;grid-template-columns:1fr 372px;gap:44px;padding:26px 0 64px;align-items:start}
.summary{background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:22px;display:flex;flex-direction:column;gap:17px;position:sticky;top:82px}
.sum-item{display:flex;gap:14px;padding-bottom:16px;border-bottom:1px solid var(--rule-soft)}
.sum-item .fw{width:76px;flex:none}
.sum-lines{display:flex;flex-direction:column;gap:8px;font-size:.88rem}
.sum-lines .l{display:flex;justify-content:space-between;gap:12px}
.sum-lines .l b{font-variant-numeric:tabular-nums;font-weight:600}
.sum-total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:13px;border-top:1px solid var(--rule)}
.sum-total .lbl{font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.sum-total .amt{font-family:var(--serif);font-size:1.62rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

.pay{display:flex;flex-direction:column;gap:9px}
.pay .p{display:flex;align-items:center;gap:11px;border:1px solid var(--rule);border-radius:5px;padding:12px 14px;cursor:pointer;font-size:.88rem;background:var(--surface)}
.pay .p:hover{border-color:var(--brand)}
.pay .p[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-wash);box-shadow:inset 0 0 0 1px var(--brand)}
.pay .p .rd{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--rule);flex:none;position:relative;background:var(--surface)}
.pay .p[aria-pressed="true"] .rd{border-color:var(--brand)}
.pay .p[aria-pressed="true"] .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--brand)}
.pay .p .tail{margin-left:auto;font-size:.75rem;color:var(--ink-faint)}

/* ---------------- confirm / track ---------------- */
.narrow{max-width:760px;margin:0 auto}
.conf{text-align:center;padding:60px 0 26px;display:flex;flex-direction:column;align-items:center;gap:15px}
.conf .tick{width:52px;height:52px;border-radius:50%;background:var(--ok-wash);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700}
.ordno{font-family:var(--mono);font-size:1.05rem;font-weight:700;letter-spacing:.06em;background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:9px 16px}

.steps{display:flex;flex-direction:column;gap:0;border:1px solid var(--rule);border-radius:5px;background:var(--surface);overflow:hidden}
.stp{display:grid;grid-template-columns:44px 1fr auto;gap:15px;padding:15px 18px;border-bottom:1px solid var(--rule-soft);align-items:start}
.steps .stp:last-child{border-bottom:0}
.stp .mk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:.76rem;font-weight:700;color:var(--ink-faint);margin-top:1px;position:relative}
.stp:not(:last-child) .mk::after{content:"";position:absolute;top:100%;left:50%;width:1.5px;height:24px;background:var(--rule);transform:translateX(-50%)}
.stp.done .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.stp.done:not(:last-child) .mk::after{background:var(--ok)}
.stp.now .mk{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 0 0 4px var(--brand-wash)}
.stp h4{font-size:.94rem}
.stp.todo h4{color:var(--ink-faint);font-weight:500}
.stp p{font-size:.82rem;color:var(--ink-soft);margin-top:2px}

  // headland
  ctx.fillStyle="#191324";
  ctx.beginPath();ctx.moveTo(0,hz);ctx.lineTo(0,hz-h*.055);
  ctx.quadraticCurveTo(w*.10,hz-h*.075,w*.21,hz);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(w,hz);ctx.lineTo(w,hz-h*.038);
  ctx.quadraticCurveTo(w*.90,hz-h*.058,w*.79,hz);ctx.closePath();ctx.fill();
  vignette(ctx,w,h,.30);grain(ctx,w,h,13);
}

function drawLake(ctx,w,h){
  const hz=h*.56;
  let g=ctx.createLinearGradient(0,0,0,hz);
  g.addColorStop(0,"#7FA8C4");g.addColorStop(.55,"#BBD3DF");g.addColorStop(1,"#E8EFEE");
  ctx.fillStyle=g;ctx.fillRect(0,0,w,hz);
  const ranges=[
    {c:"#93A6B4",p:[[0,.62],[.16,.30],[.30,.52],[.46,.24],[.62,.46],[.80,.28],[1,.50]]},
    {c:"#6C8497",p:[[0,.80],[.13,.52],[.27,.72],[.42,.44],[.58,.66],[.74,.48],[.88,.70],[1,.62]]},
    {c:"#48606F",p:[[0,1],[.20,.76],[.36,.94],[.52,.70],[.70,.90],[.86,.74],[1,.92]]},
  ];
  ranges.forEach(function(rg){
    ctx.fillStyle=rg.c;ctx.beginPath();ctx.moveTo(0,hz);
    rg.p.forEach(function(pt){ctx.lineTo(pt[0]*w,hz*pt[1])});
    ctx.lineTo(w,hz);ctx.closePath();ctx.fill();
  });
  // snow caps
  ctx.fillStyle="rgba(255,255,255,.62)";
  [[.20,.76],[.52,.70],[.86,.74]].forEach(function(pk){
    ctx.beginPath();ctx.moveTo(pk[0]*w,hz*pk[1]);
    ctx.lineTo(pk[0]*w-w*.035,hz*(pk[1]+.075));ctx.lineTo(pk[0]*w+w*.035,hz*(pk[1]+.075));
    ctx.closePath();ctx.fill();
  });
  // mist
  g=ctx.createLinearGradient(0,hz*.80,0,hz);
  g.addColorStop(0,"rgba(255,255,255,0)");g.addColorStop(1,"rgba(255,255,255,.72)");
  ctx.fillStyle=g;ctx.fillRect(0,hz*.80,w,hz*.20);
  // water
  g=ctx.createLinearGradient(0,hz,0,h);
  g.addColorStop(0,"#8FAEBE");g.addColorStop(.4,"#5E7A8B");g.addColorStop(1,"#2F4351");
  ctx.fillStyle=g;ctx.fillRect(0,hz,w,h-hz);
  ctx.globalAlpha=.20;ctx.save();ctx.translate(0,hz*2);ctx.scale(1,-1);
  ranges.forEach(function(rg){
    ctx.fillStyle=rg.c;ctx.beginPath();ctx.moveTo(0,hz);
    rg.p.forEach(function(pt){ctx.lineTo(pt[0]*w,hz*pt[1])});
    ctx.lineTo(w,hz);ctx.closePath();ctx.fill();
  });
  ctx.restore();ctx.globalAlpha=1;
  const r=rng(33);
  for(let y=hz+4;y<h;y+=6){
    ctx.fillStyle="rgba(232,242,246,"+(0.16*(1-(y-hz)/(h-hz))+.03).toFixed(3)+")";
    ctx.fillRect(w*r()*.5, y, w*(.16+r()*.38), 1.4);
  }
  vignette(ctx,w,h,.22);grain(ctx,w,h,11);
}

function drawBokeh(ctx,w,h){
  let g=ctx.createLinearGradient(0,0,w*.7,h);
  g.addColorStop(0,"#4A2C18");g.addColorStop(.5,"#7A4A22");g.addColorStop(1,"#2E1A10");
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  const r=rng(11);
  for(let i=0;i<58;i++){
    const cx=r()*w, cy=r()*h, rad=w*(.018+r()*.085), a=.06+r()*.30;
    const hue=[ "255,214,150","255,182,110","255,236,196","240,160,90" ][Math.floor(r()*4)];
    const gg=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
    gg.addColorStop(0,"rgba("+hue+","+a.toFixed(3)+")");
    gg.addColorStop(.62,"rgba("+hue+","+(a*.55).toFixed(3)+")");
    gg.addColorStop(.9,"rgba("+hue+","+(a*.22).toFixed(3)+")");
    gg.addColorStop(1,"rgba("+hue+",0)");
    ctx.fillStyle=gg;ctx.beginPath();ctx.arc(cx,cy,rad,0,7);ctx.fill();
  }
  // two soft silhouettes, heavily blurred — reads as a couple in warm light
  ctx.save();
  if("filter" in ctx) ctx.filter="blur("+Math.round(w*.022)+"px)";
  ctx.fillStyle="rgba(38,20,10,.60)";
  [[.38,.30],[.60,.34]].forEach(function(p,i){
    const bx=p[0]*w, by=p[1]*h, hr=w*.085;
    ctx.beginPath();ctx.arc(bx,by,hr,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(bx,by+hr*2.5,hr*1.75,hr*2.3,0,0,7);ctx.fill();
  });
  ctx.restore();
  const gl=ctx.createRadialGradient(w*.30,h*.16,0,w*.30,h*.16,w*.85);
  gl.addColorStop(0,"rgba(255,222,168,.30)");gl.addColorStop(1,"rgba(255,222,168,0)");
  ctx.fillStyle=gl;ctx.fillRect(0,0,w,h);
  vignette(ctx,w,h,.42);grain(ctx,w,h,15);
}

function drawOld(ctx,w,h){
  let g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,"#D6BE99");g.addColorStop(.5,"#BCA179");g.addColorStop(1,"#937954");
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  ctx.save();
  if("filter" in ctx) ctx.filter="blur("+Math.round(w*.012)+"px)";
  // three figures
  [[.28,.55,1],[.5,.5,1.14],[.72,.56,.96]].forEach(function(p){
    const bx=p[0]*w, by=p[1]*h, s=p[2], hr=w*.062*s;
    ctx.fillStyle="rgba(84,64,42,.66)";
    ctx.beginPath();ctx.arc(bx,by-hr*1.9,hr,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(bx,by+hr*1.5,hr*1.5,hr*2.6,0,0,7);ctx.fill();
    ctx.fillStyle="rgba(228,209,178,.42)";
    ctx.beginPath();ctx.arc(bx,by-hr*1.9,hr*.72,0,7);ctx.fill();
  });
  ctx.fillStyle="rgba(96,76,52,.42)";ctx.fillRect(0,h*.80,w,h*.20);
  ctx.restore();
  // scratches
  const r=rng(5);ctx.globalAlpha=.20;
  for(let i=0;i<14;i++){
    ctx.strokeStyle=r()>.5?"#F3E6CE":"#6B5539";ctx.lineWidth=r()*1.1+.3;
    ctx.beginPath();const x=r()*w;ctx.moveTo(x,r()*h*.3);
    ctx.lineTo(x+(r()-.5)*w*.08,h*(.4+r()*.6));ctx.stroke();
  }
  ctx.globalAlpha=1;
  vignette(ctx,w,h,.46);grain(ctx,w,h,30);
}

function makeCanvas(drawFn,w,h){
  const c=document.createElement("canvas");c.width=w;c.height=h;
  drawFn(c.getContext("2d"),w,h);
  return c.toDataURL("image/jpeg",.86);
}

/* ------------------------------ pricing ------------------------------ */
function priceOf(prod,size,cc){
  const c=C(cc), inr=prod.base*size.mult, local=inr*c.uplift*c.rate;
  return c.code==="IN" ? Math.round(local/10)*10 : Math.round(local);
}
function money(cc,n){
  const c=C(cc);
  return c.sym+n.toLocaleString(c.code==="IN"?"en-IN":"en-US",{maximumFractionDigits:0});
}
function orderTotal(o){
  const c=C(o.cc), item=priceOf(P(o.pid),Z(o.size),o.cc);
  const ship=(o.cc==="IN"&&item>=3000)?0:c.ship;
  return {item:item,ship:ship,total:item+ship};
}

/* ------------------------------ frame markup ------------------------------ */
function frameHTML(prod,size,photo,opts){
  opts=opts||{};
  const k=opts.k||1, crop=opts.crop||{z:1,x:0,y:0};
  const inner = photo
    ? '<img src="'+photo.url+'" alt="" draggable="false" style="transform:translate('+crop.x+'%,'+crop.y+'%) scale('+crop.z+')">'
    : '<span>Your photograph</span>';
  return ''+
  '<div class="frame '+prod.cls+'" style="--mw:'+(prod.mw*k).toFixed(1)+'px;--mb:'+prod.mb+'">'+
    '<div class="mat" style="--matw:'+(prod.matw*k).toFixed(1)+'px;--matbg:'+prod.matbg+'">'+
      '<div class="win'+(photo?"":" empty")+(opts.drag?" grab":"")+'" '+
        (opts.winId?'id="'+opts.winId+'" ':'')+
        'style="--ar:'+size.w+"/"+size.h+'">'+inner+'</div>'+
    '</div>'+
  '</div>';
}

/* ------------------------------ quality guard ------------------------------ */
function quality(photo,size,zoom){
  if(!photo) return null;
  const dpi=Math.round(Math.min(photo.pw/size.w, photo.ph/size.h)/(zoom||1));
  if(dpi>=200) return {dpi:dpi,cls:"q-ok",t:"Excellent for print",
    m:"At "+size.label.replace(/ /g,"")+" this file has detail to spare."};
  if(dpi>=150) return {dpi:dpi,cls:"q-ok",t:"Good for print",
    m:"Sharp at normal viewing distance for a "+size.label.replace(/ /g,"")+" frame."};
  if(dpi>=100) return {dpi:dpi,cls:"q-wn",t:"Acceptable, but soft",
    m:"Fine from a step back. For crisp detail, choose a smaller size or reduce the zoom."};
  return {dpi:dpi,cls:"q-bd",t:"Too low for this size",
    m:"This will print visibly blurry. Pick a smaller frame, zoom out, or send a higher-resolution scan."};
}

function adminOrders(){
  const live=S.orders.filter(function(o){return o.stage<6});
  const inr=S.orders.reduce(function(a,o){
    const t=orderTotal(o); return a+t.total/C(o.cc).rate},0);
  const proof=S.orders.filter(function(o){return o.stage===1}).length;
  const toShip=S.orders.filter(function(o){return o.stage===4}).length;

  const nextActionLabel = function(o){
    if(o.stage>=6) return "Closed";
    if(o.stage===0) return autoOn("proof") ? "Move to Proofing →" : "Start Printing →";
    if(o.stage===1) return "Approve & Print →";
    if(o.stage===2) return "Assemble Frame →";
    if(o.stage===3) return "Pack Order →";
    if(o.stage===4) return "Ship & Sync AWB →";
    if(o.stage===5) return "Mark Delivered ✅";
    return "Next Stage →";
  };

  const nextActionAuto = function(o){
    if(o.stage>=6) return "None";
    if(o.stage===0) return autoOn("proof") ? "🖼️ Proof Loop + 💬 WA" : "💬 WA: Printing";
    if(o.stage===1) return autoOn("wa") ? "💬 WA: Printing Started" : "Printing";
    if(o.stage===2) return autoOn("wa") ? "💬 WA: In Workshop" : "Framing";
    if(o.stage===3) return autoOn("wa") ? "💬 WA: Packed" : "Packed";
    if(o.stage===4) return autoOn("awb") ? "🚚 AWB Sync + 💬 WA" : "Shipped";
    if(o.stage===5) return autoOn("rev") ? "⭐ Review Request + 💬 WA" : "Delivered";
    return "Notification";
  };

  const currentStageAuto = function(o){
    if(o.stage===0) return '<span style="color:var(--ink-faint); font-size:.76rem;">✉️ Order Email</span>';
    if(o.stage===1) return '<span style="color:'+(autoOn("proof")?'var(--brand)':'var(--ink-faint)')+'; font-size:.76rem; font-weight:600;">🖼️ Proof Approval '+(autoOn("proof")?'⚡ON':'OFF')+'</span>';
    if(o.stage===2) return '<span style="color:'+(autoOn("wa")?'var(--brand)':'var(--ink-faint)')+'; font-size:.76rem; font-weight:600;">💬 WA Printing '+(autoOn("wa")?'⚡ON':'OFF')+'</span>';
    if(o.stage===3) return '<span style="color:'+(autoOn("wa")?'var(--brand)':'var(--ink-faint)')+'; font-size:.76rem; font-weight:600;">💬 WA Framing '+(autoOn("wa")?'⚡ON':'OFF')+'</span>';
    if(o.stage===4) return '<span style="color:'+(autoOn("wa")?'var(--brand)':'var(--ink-faint)')+'; font-size:.76rem; font-weight:600;">💬 WA Packed '+(autoOn("wa")?'⚡ON':'OFF')+'</span>';
    if(o.stage===5) return '<span style="color:'+(autoOn("awb")?'var(--brand)':'var(--ink-faint)')+'; font-size:.76rem; font-weight:600;">🚚 AWB Sync '+(autoOn("awb")?'⚡ON':'OFF')+'</span>';
    if(o.stage===6) return '<span style="color:'+(autoOn("rev")?'var(--brand)':'var(--ink-faint)')+'; font-size:.76rem; font-weight:600;">⭐ Review Nudge '+(autoOn("rev")?'⚡ON':'OFF')+'</span>';
    return '<span style="font-size:.76rem;">None</span>';
  };

  return '<div class="stack gap4" style="margin-bottom:16px">'+
      '<h2>Orders &amp; Fulfilment Pipeline</h2>'+
      '<p class="sub">Manage order stages from production to delivery. Advancing or jumping stages automatically executes active automations.</p></div>'+

    '<div class="callout c-brass" style="margin-bottom:18px"><span class="ic">⚡</span><span>'+
      '<b>Automations Integrated:</b> Moving orders via <b>Next Action</b> or <b>Jump to Stage</b> executes live automations (💬 WhatsApp Updates, 🖼️ Proof Approvals, 🚚 AWB Sync, ⭐ Review Requests). '+
      'Toggle active automations directly using the quick switches below.</span></div>'+

    '<div class="pane" style="margin-bottom:18px; padding:12px 18px; background:var(--surface-2); border:1px solid var(--rule);">'+
      '<div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap; font-size:.82rem;">'+
        '<span style="font-weight:700; color:var(--brand-ink); text-transform:uppercase; letter-spacing:.08em; font-size:.72rem;">Quick Automation Controls:</span>'+
        '<label style="display:flex; align-items:center; gap:6px; cursor:pointer;"><button class="sw" data-toggle-auto="wa" aria-pressed="'+autoOn("wa")+'" style="transform:scale(.85)"></button> 💬 WhatsApp Updates</label>'+
        '<label style="display:flex; align-items:center; gap:6px; cursor:pointer;"><button class="sw" data-toggle-auto="proof" aria-pressed="'+autoOn("proof")+'" style="transform:scale(.85)"></button> 🖼️ Proof Loop</label>'+
        '<label style="display:flex; align-items:center; gap:6px; cursor:pointer;"><button class="sw" data-toggle-auto="awb" aria-pressed="'+autoOn("awb")+'" style="transform:scale(.85)"></button> 🚚 AWB Tracking Sync</label>'+
        '<label style="display:flex; align-items:center; gap:6px; cursor:pointer;"><button class="sw" data-toggle-auto="rev" aria-pressed="'+autoOn("rev")+'" style="transform:scale(.85)"></button> ⭐ Review Requests</label>'+
      '</div>'+
    '</div>'+

    '<div class="tiles">'+
      '<div class="tile"><span class="k">Open orders</span><span class="v">'+live.length+'</span><span class="d">'+S.orders.length+' total this month</span></div>'+
      '<div class="tile"><span class="k">Value this month</span><span class="v">₹'+Math.round(inr).toLocaleString("en-IN")+'</span><span class="d up">▲ 18% on July</span></div>'+

      '<div class="tile'+(toShip?" alert":"")+'"><span class="k">To ship today</span><span class="v">'+toShip+'</span><span class="d">Packed and labelled</span></div>'+
    '</div>'+

        S.orders.map(function(o){

            if(stIdx===6) return '';

            return '<span title="'+STAGES[stIdx].k+'" style="display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:3px; background:'+

function render(){
  const shell=$("#shell");
  if(S.view==="admin"){ shell.innerHTML=viewAdmin(); }
  else{
    const body =
      S.view==="product"  ? viewProduct()  :
      S.view==="studio"   ? viewStudio()   :
      S.view==="checkout" ? viewCheckout() :
      S.view==="confirm"  ? viewConfirm()  :
      S.view==="track"    ? viewTrack()    : viewHome();
    shell.innerHTML=siteHeader()+'<main>'+body+'</main>'+siteFooter();
  }
  wire();
  if(S.view!=="admin") window.scrollTo({top:0,behavior:"instant"});
}

function go(v){
  if(v==="catalogue"){
    S.view="home"; render();
    setTimeout(function(){const e=$("#catalogue");if(e)e.scrollIntoView({behavior:"smooth"})},40);
    return;
  }
  if(v==="checkout"&&!S.photo) return;
  S.view=v; S.errs={}; render();
}

function wire(){
  $$("[data-go]").forEach(function(b){b.onclick=function(){go(b.dataset.go)}});

  const cs=$("#ccSel");
  if(cs) cs.onchange=function(){S.cc=cs.value;render()};
  const cs2=$("#f_cc2");
  if(cs2) cs2.onchange=function(){S.cc=cs2.value;render()};

  $$("[data-open]").forEach(function(b){b.onclick=function(){
    S.pid=b.dataset.open; S.view="product"; render()}});
  $$("[data-size]").forEach(function(b){b.onclick=function(){
    S.size=b.dataset.size; render()}});
  $$("[data-pay]").forEach(function(b){b.onclick=function(){
    S.payMethod=b.dataset.pay; render()}});
  $$("[data-tab]").forEach(function(b){b.onclick=function(){
    S.adminTab=b.dataset.tab; render()}});

  // ---- studio: samples, file, zoom, drag ----
  $$("[data-sample]").forEach(function(b){b.onclick=function(){
    const s=SAMPLES.filter(function(x){return x.id===b.dataset.sample})[0];
    S.photo={id:s.id,url:s.url,pw:s.pw,ph:s.ph,label:s.label};
    S.crop={z:1,x:0,y:0}; render();
  }});

  const drop=$("#drop"), file=$("#file");
  if(drop&&file){
    drop.onclick=function(){file.click()};
    drop.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();file.click()}};
    drop.ondragover=function(e){e.preventDefault();drop.classList.add("over")};
    drop.ondragleave=function(){drop.classList.remove("over")};
    drop.ondrop=function(e){e.preventDefault();drop.classList.remove("over");
      if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0])};
    file.onchange=function(){if(file.files[0]) loadFile(file.files[0])};
  }

  const zoom=$("#zoom");
  if(zoom) zoom.oninput=function(){
    S.crop.z=parseFloat(zoom.value);
    const img=$("#cropWin img");
    if(img) img.style.transform="translate("+S.crop.x+"%,"+S.crop.y+"%) scale("+S.crop.z+")";
    const lbl=zoom.parentNode.querySelector(".mono");
    if(lbl) lbl.textContent=S.crop.z.toFixed(2)+"×";
    updateQuality();
  };
  zoom&&(zoom.onchange=function(){render()});

  const win=$("#cropWin");
  if(win&&S.photo) enableDrag(win);

  // ---- actions ----
  $$("[data-act]").forEach(function(b){b.onclick=function(){act(b.dataset.act)}});
  $$("[data-field]").forEach(function(i){i.oninput=function(){
    S.buyer[i.dataset.field]=i.value;
    if(i.dataset.field==="zip") render();
  }});
  $$("[data-adv]").forEach(function(b){b.onclick=function(){advance(b.dataset.adv)}});
  $$("[data-set-stage]").forEach(function(s){s.onchange=function(){advance(s.dataset.setStage, s.value)}});

  $$("[data-price]").forEach(function(i){
    i.onchange=function(){
      const c=C(i.dataset.price), k=i.dataset.key, v=parseFloat(i.value);
      if(isNaN(v)) return;
      c[k]= k==="uplift" ? Math.max(1,Math.min(3,v)) : Math.max(0,Math.round(v));
      render();
    }});
  $$("[data-toggle-cc]").forEach(function(b){b.onclick=function(){
    const c=C(b.dataset.toggleCc); c.on=!c.on;
    if(!c.on&&S.cc===c.code) S.cc="IN";
    render();
  }});
  $$("[data-toggle-nr]").forEach(function(b){b.onclick=function(){
    const c=C(b.dataset.toggleNr); c.nonReturnable=!c.nonReturnable;
    render();
  }});
  $$("[data-toggle-auto]").forEach(function(b){b.onclick=function(){
    const a=S.autos.filter(function(x){return x.id===b.dataset.toggleAuto})[0];
    a.on=!a.on; render();
  }});

  // ---- pincode & non-returnable admin handlers ----
  $$("[data-del-block]").forEach(function(b){b.onclick=function(){
    S.blockedPincodes=S.blockedPincodes.filter(function(z){return z!==b.dataset.delBlock});
    render();
  }});
  $$("[data-del-nr]").forEach(function(b){b.onclick=function(){
    S.nonReturnPincodes=S.nonReturnPincodes.filter(function(z){return z!==b.dataset.delNr});
    render();
  }});

  const bBlock=$("#btnBlockZip"), iBlock=$("#inpBlockZip");
  if(bBlock&&iBlock){
    bBlock.onclick=function(){
      const val=iBlock.value.trim();
      if(val && S.blockedPincodes.indexOf(val)<0){
        S.blockedPincodes.push(val); render();
      }
    };
  }

  const bNr=$("#btnNrZip"), iNr=$("#inpNrZip");

    bNr.onclick=function(){
      const val=iNr.value.trim();
      if(val && S.nonReturnPincodes.indexOf(val)<0){
        S.nonReturnPincodes.push(val); render();
      }
    };
  }
}

function enableDrag(win){
  let on=false,sx=0,sy=0,ox=0,oy=0;
  const img=win.querySelector("img");
  if(!img) return;
  win.addEventListener("pointerdown",function(e){
    on=true;win.classList.add("grabbing");win.setPointerCapture(e.pointerId);
    sx=e.clientX;sy=e.clientY;ox=S.crop.x;oy=S.crop.y;
  });
  win.addEventListener("pointermove",function(e){
    if(!on) return;
    const r=win.getBoundingClientRect(), lim=Math.max(0,(S.crop.z-1)*50);
    S.crop.x=Math.max(-lim,Math.min(lim, ox+(e.clientX-sx)/r.width*100));
    S.crop.y=Math.max(-lim,Math.min(lim, oy+(e.clientY-sy)/r.height*100));
    img.style.transform="translate("+S.crop.x+"%,"+S.crop.y+"%) scale("+S.crop.z+")";
  });
  ["pointerup","pointercancel","pointerleave"].forEach(function(ev){
    win.addEventListener(ev,function(){on=false;win.classList.remove("grabbing")});
  });
}

function loadFile(f){
  if(!/^image\//.test(f.type)){alert("Please choose an image file.");return}
  const fr=new FileReader();
  fr.onload=function(){
    const im=new Image();
    im.onload=function(){
      S.photo={id:"upload",url:fr.result,pw:im.naturalWidth,ph:im.naturalHeight,label:f.name};
      S.crop={z:1,x:0,y:0}; render();
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(f);
}

function advance(id, targetStage){
  const o=S.orders.filter(function(x){return x.id===id})[0];
  if(!o) return;

  if(targetStage !== undefined){
    const dest = parseInt(targetStage, 10);
    if(isNaN(dest) || dest < 0 || dest > 6) return;
    o.stage = dest;
  } else {
    if(o.stage>=6) return;
    let next=o.stage+1;
    if(next===1&&!autoOn("proof")) next=2;
    o.stage=next;
  }

  if(o.stage===5&&!o.awb&&autoOn("awb")){
    o.awb=(o.cc==="IN"?"DL":"ARX")+Math.floor(2000000+Math.random()*7999999);
  }
  render();

  const first=o.who.split(" ")[0];
  const msgs={
    1:{t:"Approve your mockup",
       b:"<b>Your proof is ready 🖼️</b>\nHi "+esc(first)+", here is how "+esc(o.id)+
         " will look framed.\n\n<b>Tap to approve</b> or reply with a change. Nothing is printed until you say yes.",
       a:"Automation: Proof approval loop"},
    2:{t:"Printing started",
       b:"<b>We are printing 🖨️</b>\nYour photograph is on the press now, on archival matte paper.",
       a:"Automation: WhatsApp order updates"},
    3:{t:"Framing by hand",
       b:"<b>In the workshop 🔨</b>\nMount cut, glass in, "+esc(P(o.pid).name)+" being assembled by hand.",
       a:"Automation: WhatsApp order updates"},
    4:{t:"Packed and ready",
       b:"<b>Packed 📦</b>\nCorner-protected and double-boxed. It ships from Nashik tomorrow morning.",
       a:"Automation: WhatsApp order updates"},
    5:{t:"On its way",
       b:"<b>Shipped 🚚</b>\nTracking <b>"+esc(o.awb||"pending")+"</b>\nEstimated arrival in "+
         esc(C(o.cc).days)+" to "+esc(o.city)+".",
       a:"Automation: Courier tracking sync"},
    6:{t:"Delivered",
       b:"<b>Delivered ✅</b>\nHope it looks right on the wall, "+esc(first)+
         ".\n\nIf anything arrived damaged, reply here and we will remake it.",
       a:"Automation: WhatsApp order updates"},
  };

  if(autoOn("wa")||(o.stage===1&&autoOn("proof"))){
    const m=msgs[o.stage];
    if(m) toast("Frame & Co · WhatsApp",m.b,m.a);
  }
  if(o.stage===6&&autoOn("rev")){
    setTimeout(function(){toast("Frame & Co · WhatsApp",
      "<b>How did it turn out? ⭐</b>\nIf you have a moment, a photo of it on your wall helps us enormously.\n\n<b>Leave a review</b>",
      "Automation: Review request after delivery")},1800);
  }
  if(o.stage===6&&autoOn("occ")&&o.occ){
    setTimeout(function(){toast("Frame & Co · Scheduled",
      "<b>Reminder set 📅</b>\nWe will message "+esc(first)+" three weeks before this occasion next year.",
      "Automation: Occasion reminder")},2600);
  }
}

/* ------------------------------ boot ------------------------------ */
S.pid=PRODUCTS[0].id;
render();
</script>
